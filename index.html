<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psalm Prayers</title>
<style>
  :root {
    --bg: #faf8f4;
    --fg: #26221c;
    --muted: #7a7264;
    --card: #ffffff;
    --border: #e5ded2;
    --accent: #8a6d3b;
  }
  [data-theme="dark"] {
    --bg: #171512;
    --fg: #ece7dd;
    --muted: #9a917f;
    --card: #211e1a;
    --border: #3a352d;
    --accent: #c9a45c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    background: var(--bg);
    color: var(--fg);
    font-family: Georgia, "Times New Roman", serif;
    transition: background 0.25s, color 0.25s;
  }
  main { max-width: 620px; width: 100%; text-align: center; }
  h1 {
    font-size: 1.05rem;
    font-weight: normal;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 2rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2.2rem 2rem;
    transition: background 0.25s, border-color 0.25s;
  }
  .title { font-size: 1.25rem; margin: 0 0 1rem; }
  .antiphon {
    font-style: italic;
    color: var(--accent);
    font-size: 1.1rem;
    margin: 0 0 1.2rem;
  }
  .text { font-size: 1.15rem; line-height: 1.75; margin: 0; white-space: pre-wrap; text-align: left; }
  .source { margin-top: 1.8rem; font-size: 0.9rem; color: var(--muted); }
  .source a { color: var(--accent); text-decoration: none; }
  .source a:hover { text-decoration: underline; }
  .controls { margin-top: 2rem; display: flex; gap: 0.75rem; justify-content: center; }
  button {
    font-family: inherit;
    font-size: 0.95rem;
    padding: 0.55rem 1.2rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--fg);
    cursor: pointer;
    transition: background 0.25s, color 0.25s, border-color 0.25s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .count { margin-top: 1.2rem; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Psalm Prayers</h1>
  <div class="card">
    <p class="title" id="title"></p>
    <p class="antiphon" id="antiphon"></p>
    <p class="text" id="text"></p>
    <p class="source" id="source"></p>
  </div>
  <div class="controls">
    <button id="another" type="button">Another prayer</button>
    <button id="theme" type="button">Dark</button>
  </div>
  <p class="count" id="count"></p>
</main>

<script>
  // ==========================================================
  //  THE COLLECTION lives in prayers.json, in this same repo.
  //  It only grows from what Ping adds, one entry at a time.
  //
  //  To add a prayer, add one entry to the "prayers" list in
  //  prayers.json:
  //
  //    {
  //      "title": "",
  //      "antiphon": "",
  //      "text": "The FULL text exactly as the source presents
  //               it, word for word - for Divine Office, the
  //               whole psalmody: antiphons, parts, Glory be,
  //               psalm-prayer. Nothing added, nothing
  //               paraphrased, nothing of ours.",
  //      "source": "Divine Office - Office of Readings, ...",
  //      "url": "https://divineoffice.org/..."
  //    }
  //
  //  Fields:
  //    title    - just the psalm number, as the source names
  //               it (may be empty; the full text carries its
  //               own heading)
  //    antiphon - the antiphon Ping remembers it by (optional,
  //               may be empty)
  //    text     - the full source text, verbatim
  //    source   - where it came from, in words
  //    url      - link to the source page (USCCB, Divine
  //               Office, ...)
  // ==========================================================
  let PRAYERS = [];
  fetch('prayers.json')
    .then(r => r.json())
    .then(data => { PRAYERS = data.prayers || []; showRandom(); })
    .catch(() => {
      document.getElementById('text').textContent =
        'Could not load prayers.json.';
    });

  // Theme: saved choice wins, otherwise follow the system.
  const root = document.documentElement;
  const themeBtn = document.getElementById('theme');
  function setTheme(t) {
    root.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'dark' ? 'Light' : 'Dark';
    try { localStorage.setItem('psalm-prayers-theme', t); } catch (e) {}
  }
  let saved = null;
  try { saved = localStorage.getItem('psalm-prayers-theme'); } catch (e) {}
  setTheme(saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  themeBtn.addEventListener('click', () =>
    setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

  // Random prayer, never the same one twice in a row.
  let last = -1;
  function showRandom() {
    if (!PRAYERS.length) return;
    let i;
    do { i = Math.floor(Math.random() * PRAYERS.length); }
    while (PRAYERS.length > 1 && i === last);
    last = i;
    const p = PRAYERS[i];
    const titleEl = document.getElementById('title');
    titleEl.textContent = p.title || '';
    titleEl.style.display = p.title ? '' : 'none';
    const ant = document.getElementById('antiphon');
    ant.textContent = p.antiphon ? '“' + p.antiphon + '”' : '';
    ant.style.display = p.antiphon ? '' : 'none';
    document.getElementById('text').textContent = p.text || '';
    const src = document.getElementById('source');
    if (p.url) {
      src.innerHTML = '';
      const a = document.createElement('a');
      a.href = p.url; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = p.source || p.url;
      src.appendChild(a);
    } else {
      src.textContent = p.source || '';
    }
    document.getElementById('count').textContent =
      PRAYERS.length + (PRAYERS.length === 1 ? ' prayer collected' : ' prayers collected');
  }
  document.getElementById('another').addEventListener('click', showRandom);
  showRandom();
</script>
</body>
</html>
